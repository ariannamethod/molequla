# Schedule for the phone-1 colony. molequla never runs non-stop: it runs in
# capped sessions and the colony is down in between. Every value here can be
# overridden by an environment variable of the same name, and the file itself
# can be replaced with SCHEDULE_CONF=/path/to/other.conf.

# UTC start times, HH:MM, any order, at least one.
SCHEDULE_SLOTS="04:00 12:00 20:00"

# Session length in seconds. launch.sh wraps every process in `timeout DUR`,
# so this is a hard cap even if the scheduler dies.
SCHEDULE_DUR=7200

# Seconds after the cap before the scheduler stops calling the survivors names
# and starts sending signals.
SCHEDULE_GRACE=90

# How often VmHWM is sampled during a session, in seconds.
SCHEDULE_SAMPLE=30

# A slot reached later than this many seconds after its start is not run: the
# phone was suspended or the daemon was down, and a session that begins hours
# late is not the session that was scheduled.
SCHEDULE_CATCHUP=1800

# oom_score_adj written to the organisms after launch. Android's lmkd picks
# its victim by this number: with the organisms above Termux, a memory squeeze
# costs a checkpointed organism instead of the whole terminal. Empty disables.
SCHEDULE_OOM_ADJ=500

# --- the senses -------------------------------------------------------------
# The second kind of slot. The organisms sleep sixteen hours a day; the camera,
# the microphone and the place do not, and what they gather waits in the DNA
# field until an organism wakes. These times are the gaps between the colony
# windows (04-06, 12-14, 20-22 UTC) with an hour of clearance on either side,
# so a session that overran never meets a pass that is about to hold a
# gigabyte for the eye. Empty this line and the scheduler is the colony-only
# scheduler it was before.
SENSES_SLOTS="01:00 03:00 07:00 09:00 11:00 15:00 17:00 19:00 23:00"

# What a senses slot runs. The default is phone1/senses.sh beside this file,
# one pass of all three organs.
SENSES_CMD=""

# Hard cap on one pass, in seconds. A pass measured on this phone: two camera
# frames through the eye ~31 s, twelve seconds of microphone plus recognition
# ~20 s, place ~5 s. 600 s is ten times the measurement, for the day the
# network hangs.
SENSES_TIMEOUT=600
